<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Курс</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Курс">
<meta name="theme-color" content="#08080A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#08080A; --muted:#9A9AA2; --dim:#8E8E96; --silver:#B4B4BB; --up:#8FE3B0; --down:#F2A29B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#F2F2F4;font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:2px}
.app{position:relative;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden;isolation:isolate}
.rings{position:absolute;top:0;right:0;width:0;height:0;z-index:-1;pointer-events:none}
.rings i{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.rings i:nth-child(1){width:340px;height:340px;border:1px solid rgba(255,255,255,.10)}
.rings i:nth-child(2){width:270px;height:270px;border:1px solid rgba(255,255,255,.06)}

.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 55%,rgba(255,255,255,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.12),0 18px 40px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.glass.strong{background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 1px rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.14),0 10px 24px rgba(0,0,0,.5)}
.silver{background:linear-gradient(180deg,#fff 0%,#A6A6AE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.title{font-size:16px;font-weight:600;letter-spacing:.22em}
.status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px rgba(143,227,176,.8);animation:pulse 2.4s ease-in-out infinite}
.dot.bad{background:var(--down);box-shadow:0 0 8px rgba(242,162,155,.8)}
@keyframes pulse{50%{opacity:.35}}
.refresh{position:relative;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.refresh svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.refresh svg.ring circle{transition:stroke-dashoffset .9s linear}
.refresh .arrow{transition:transform .7s ease-in-out}

.card{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#A1A1AA}
.row-label label{font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.amount{display:flex;align-items:baseline;gap:10px}
.amount input{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:0;color:#fff;
  font-family:var(--font);font-weight:200;font-size:48px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;caret-color:#fff}
.amount input::placeholder{color:#55555C}
.amount .glyph{font-size:30px;font-weight:200;color:var(--silver)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
.seg button{height:46px;border-radius:12px;font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--dim);transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(170deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.5)}

.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:20px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .15s}
.res:active{transform:scale(.985)}
.res .left{display:flex;align-items:center;gap:12px;min-width:0}
.orb{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:-.02em;color:#fff;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.03) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.45)}
.code{font-size:14px;font-weight:600;letter-spacing:.06em;color:#F4F4F5}
.name{font-size:12px;color:var(--muted);margin-top:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.val{font-size:26px;font-weight:300;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sub{font-size:12px;color:var(--muted);white-space:nowrap}
.sub.ok{color:var(--up)}

.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 2px}
.rate .k{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.rate .v{font-size:17px;font-weight:400;color:#fff;margin-top:4px}
.rate .d{font-size:11px;margin-top:2px;color:var(--muted)}
.rate .d.up{color:var(--up)} .rate .d.down{color:var(--down)}
#sources{white-space:pre}

footer{margin-top:auto;display:flex;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--down);text-align:center}
</style>
</head>
<body>
<main class="app">
  <div class="rings" aria-hidden="true"><i></i><i></i></div>

  <header>
    <div class="brand">
      <div class="logo glass strong" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 30 30" fill="none"><circle cx="11.5" cy="15" r="8" stroke="#F4F4F5" stroke-width="1.4"/><circle cx="18.5" cy="15" r="8" stroke="#9A9AA2" stroke-width="1.4"/></svg>
      </div>
      <div>
        <div class="title silver">КУРС</div>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Загрузка…</span></div>
      </div>
    </div>
    <button class="refresh glass strong" id="refresh" type="button" aria-label="Обновить курсы">
      <svg class="ring" width="50" height="50" viewBox="0 0 50 50" fill="none" aria-hidden="true">
        <circle cx="25" cy="25" r="22" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="138.23" stroke-dashoffset="0" id="ringc"/>
      </svg>
      <svg class="arrow" id="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <section class="card glass">
    <div class="row-label"><label for="amt">Сумма</label><span id="srcName">Доллар США</span></div>
    <div class="amount">
      <input id="amt" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Сумма">
      <span class="glyph" id="srcGlyph">$</span>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Валюта суммы">
      <button type="button" data-c="RUB">RUB</button>
      <button type="button" data-c="USD">USD</button>
      <button type="button" data-c="USDT">USDT</button>
      <button type="button" data-c="AED">AED</button>
    </div>
  </section>

  <section class="results" id="results"></section>

  <section class="rates" aria-label="Курсы">
    <div class="rate"><div class="k">USD · РЫНОК</div><div class="v" id="rMarket">—</div><div class="d" id="rMarketD">&nbsp;</div></div>
    <div class="rate"><div class="k">USD · ЦБ</div><div class="v" id="rCbr">—</div><div class="d" id="rCbrD">&nbsp;</div></div>
    <div class="rate"><div class="k">USDT</div><div class="v" id="rUsdt">—</div><div class="d" id="rUsdtD">&nbsp;</div></div>
  </section>

  <div class="err" id="err" hidden></div>

  <footer><span id="sources">USD · USDT</span><span id="left">&nbsp;</span></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const INTERVAL = 60;
const AED_PER_USD = 3.6725; // дирхам жёстко привязан к доллару
const CUR = {
  RUB:  { glyph:'₽', name:'Российский рубль' },
  USD:  { glyph:'$', name:'Доллар США' },
  USDT: { glyph:'₮', name:'Tether · USDT' },
  AED:  { glyph:'Dh', name:'Дирхам ОАЭ' }
};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('kurs.'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('kurs.'+k, JSON.stringify(v)); }catch(e){} }
};

let R = store.get('rates');          // { usd, usdSrc, cbr, cbrPrev, usdt, usdtSrc, usdtPrev, ts }
let src = store.get('src') || 'USD';
let next = Date.now() + INTERVAL*1000;
let loading = false, failed = false, spin = 0;

const nf = d => new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt = (v,d=2) => nf(d).format(v);
const parse = s => { const n = parseFloat(String(s).replace(/[\s  ]/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const sane = v => v > 20 && v < 500;
const pad = n => String(n).padStart(2,'0');
const hms = t => { const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };

async function getJSON(url, opts){
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 9000);
  try{ const r = await fetch(url,{cache:'no-store',signal:ctrl.signal,...opts}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

// USDT/RUB из браузера напрямую не получить (биржи запрещают такие запросы), его приносит rates.json.
async function fetchUSDT(){ return null; }

async function refresh(){
  if(loading) return;
  loading = true; paintStatus();
  // 1) Курсы, которые GitHub собирает каждые ~10 минут: рыночный доллар и USDT с Rapira.
  try{
    const j = await getJSON('rates.json?t=' + Date.now());
    if(sane(j.usd) && sane(j.usdt) && Date.now() - j.ts < 3*3600*1000){
      R = { ...j, fetched: Date.now() }; failed = false; store.set('rates', R);
      loading = false; next = Date.now() + INTERVAL*1000; paint(); return;
    }
  }catch(e){}
  // 2) Запасной путь прямо из браузера.
  const [fx, cbr, t] = await Promise.allSettled([
    getJSON('https://open.er-api.com/v6/latest/USD'),
    getJSON('https://www.cbr-xml-daily.ru/daily_json.js'),
    fetchUSDT()
  ]);
  const n = { ...(R||{}), ts: Date.now() };
  let got = false;
  if(fx.status==='fulfilled' && sane(fx.value?.rates?.RUB)){ n.usd = fx.value.rates.RUB; n.usdSrc = 'рынок'; got = true; }
  if(cbr.status==='fulfilled' && sane(cbr.value?.Valute?.USD?.Value)){
    n.cbr = cbr.value.Valute.USD.Value; n.cbrPrev = cbr.value.Valute.USD.Previous; got = true;
    if(!sane(n.usd)){ n.usd = n.cbr; n.usdSrc = 'ЦБ'; }
  }
  if(t.status==='fulfilled' && t.value){ Object.assign(n, t.value); got = true; }
  loading = false;
  if(got && sane(n.usd) && sane(n.usdt)){ R = n; failed = false; store.set('rates', R); }
  else failed = true;
  next = Date.now() + INTERVAL*1000;
  paint();
}

function rate(c){ if(!R) return null; return c==='RUB' ? 1 : c==='USD' ? R.usd : c==='AED' ? R.usd/AED_PER_USD : R.usdt; }

function paintResults(){
  const a = parse($('amt').value);
  const from = rate(src);
  const box = $('results'); box.innerHTML = '';
  ['RUB','USD','USDT','AED'].filter(c => c!==src).forEach(c => {
    const to = rate(c);
    const v = (from && to) ? a*from/to : null;
    const sub = !R ? ' ' : c==='RUB' ? '1 ₽ = '+fmt(1/R.usd,4)+' $' : c==='USD' ? '1 $ = '+fmt(R.usd)+' ₽' : c==='AED' ? '1 Dh = '+fmt(R.usd/AED_PER_USD)+' ₽' : '1 ₮ = '+fmt(R.usdt)+' ₽';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'res';
    b.setAttribute('aria-label', 'Скопировать сумму в '+c);
    b.innerHTML = '<span class="left"><span class="orb"></span><span><div class="code"></div><div class="name"></div></span></span>'+
                  '<span class="right"><span class="val silver"></span><span class="sub"></span></span>';
    b.querySelector('.orb').textContent = CUR[c].glyph;
    b.querySelector('.code').textContent = c;
    b.querySelector('.name').textContent = CUR[c].name;
    b.querySelector('.val').textContent = v==null ? '—' : fmt(v)+' '+CUR[c].glyph;
    const s = b.querySelector('.sub'); s.textContent = sub;
    b.addEventListener('click', async () => {
      if(v==null) return;
      try{ await navigator.clipboard.writeText(fmt(v).replace(/[\s  ]/g,'')); s.textContent = 'Скопировано'; s.classList.add('ok');
        setTimeout(()=>{ s.textContent = sub; s.classList.remove('ok'); }, 1300); }catch(e){}
    });
    box.appendChild(b);
  });
}

function change(now, prev){
  if(!prev || !now) return { t:'&nbsp;', cls:'' };
  const ch = now - prev, pct = ch/prev*100;
  return { t:(ch>=0?'▲ +':'▼ ')+fmt(ch)+' · '+fmt(Math.abs(pct))+'%', cls: ch>=0?'up':'down' };
}

function paintRates(){
  if(!R) return;
  $('rMarket').textContent = R.usdSrc==='рынок' ? fmt(R.usd) : '—';
  $('rMarketD').textContent = R.usdSrc==='рынок' && R.cbr ? 'к ЦБ '+(R.usd>=R.cbr?'+':'')+fmt((R.usd/R.cbr-1)*100)+'%' : ' ';
  $('rCbr').textContent = R.cbr ? fmt(R.cbr) : '—';
  const c = change(R.cbr, R.cbrPrev); $('rCbrD').innerHTML = c.t; $('rCbrD').className = 'd '+c.cls;
  $('rUsdt').textContent = fmt(R.usdt);
  $('rUsdtD').textContent = R.usd ? 'к $ '+(R.usdt>=R.usd?'+':'')+fmt((R.usdt/R.usd-1)*100)+'%' : ' ';
  $('sources').textContent = 'USD · '+R.usdSrc+'   USDT · '+R.usdtSrc;
}

function paintStatus(){
  const dot = $('dot');
  dot.classList.toggle('bad', failed && !loading);
  if(!R) $('status').textContent = loading ? 'Загрузка…' : 'Нет связи';
  else $('status').textContent = (failed && !loading ? 'Нет связи · курс на ' : 'Live · курс на ') + hms(R.ts).slice(0,5);
  $('err').hidden = !(failed && !loading);
  $('err').textContent = R ? 'Курсы не обновились, показаны последние сохранённые.' : 'Нет связи с источниками курсов. Проверь интернет и нажми ↻.';
}

function paintSrc(){
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c===src)));
  $('srcGlyph').textContent = CUR[src].glyph;
  $('srcName').textContent = CUR[src].name;
}

function paint(){ paintSrc(); paintResults(); paintRates(); paintStatus(); tick(); }

function tick(){
  const left = Math.max(0, Math.round((next - Date.now())/1000));
  $('left').textContent = loading ? 'обновляю…' : 'обновление через '+left+' с';
  $('ringc').setAttribute('stroke-dashoffset', (138.23*(1-left/INTERVAL)).toFixed(2));
  if(left<=0 && !loading && document.visibilityState==='visible') refresh();
}

$('amt').addEventListener('input', e => {
  const cleaned = e.target.value.replace(/[^\d.,\s]/g,'');
  if(cleaned!==e.target.value) e.target.value = cleaned;
  paintResults();
});
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.dataset.c===src) return;
  const a = parse($('amt').value), from = rate(src), to = rate(b.dataset.c);
  if(a>0 && from && to) $('amt').value = fmt(a*from/to);
  src = b.dataset.c; store.set('src', src); paint();
});
$('refresh').addEventListener('click', () => {
  spin += 360; $('arrow').style.transform = 'rotate('+spin+'deg)';
  refresh();
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && (!R || Date.now()-R.ts > 30000)) refresh();
});

paint();
refresh();
setInterval(tick, 1000);
</script>
</body>
</html>
